<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Orchard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        .backgroundLink {
            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            width: 100%;
            height: 100%;

            text-decoration: none;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.25),
                    rgba(0,0,0,0.45)
                ),
                url("ART ORCHARD.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            overflow: hidden;
        }

        .overlay {
            text-align: center;

            color: white;

            animation: fadeIn 1.2s ease;
        }

        h1 {
            margin: 0;

            font-size: 82px;

            letter-spacing: -3px;

            text-shadow:
                0 8px 25px rgba(0,0,0,0.4);
        }

        p {
            margin-top: 18px;

            font-size: 24px;

            opacity: 0.9;

            letter-spacing: 1px;
        }

        .enterButton {
            margin-top: 40px;

            display: inline-block;

            padding: 18px 34px;

            border-radius: 999px;

            background: rgba(255,255,255,0.14);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.22);

            color: white;

            font-size: 18px;

            font-weight: bold;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .backgroundLink:hover .enterButton {
            transform: translateY(-4px);

            background: rgba(255,255,255,0.22);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.25);
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }

    </style>
</head>

<body>

    <a href="choose.html" class="backgroundLink">

        <div class="overlay">

            <h1>Art Orchard</h1>

            <p>Branch ideas into existence.</p>

            <div class="enterButton">
                Click to Enter
            </div>

        </div>

    </a>

</body>

</html>
