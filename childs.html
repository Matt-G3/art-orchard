<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Branch Tree</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 50px;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.65),
                    rgba(255,255,255,0.75)
                ),
                url("background.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            color: #222;
        }

        h1 {
            font-size: 54px;
        }

        #makeChildButton {
            margin-bottom: 40px;
            padding: 16px 26px;
            border: none;
            border-radius: 999px;
            background: #222;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .treeWrapper {
            overflow-x: auto;
            padding: 50px;
            border-radius: 28px;
            background: rgba(255,255,255,0.62);
            box-shadow: 0 18px 45px rgba(0,0,0,0.1);
        }

        .tree {
            display: flex;
            justify-content: center;
            min-width: max-content;
        }

        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .nodeCard {
            width: 230px;
            border-radius: 24px;
            background: white;
            padding: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            cursor: pointer;
            z-index: 2;
        }

        .nodeCard img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            display: block;
            border-radius: 18px;
            background: white;
        }

        .connectorArea {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .verticalConnector {
            width: 70px;
            height: 110px;
            object-fit: fill;
        }

        .horizontalConnector {
            width: 100%;
            height: 70px;
            object-fit: fill;
            margin-top: -20px;
            margin-bottom: -10px;
        }

        .children {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 120px;
        }

        .childWrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sideConnector {
            width: 190px;
            height: 130px;
            object-fit: fill;
            margin-bottom: -45px;
        }

        .empty {
            font-size: 18px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <h1>Branch Tree</h1>

    <button id="makeChildButton">Make Branch Image</button>

    <div class="treeWrapper">
        <div id="tree" class="tree">
            <p class="empty">Loading tree...</p>
        </div>
    </div>

    <script>
        const API = "https://Matthew2007.pythonanywhere.com";

        const LINE_DOWN = "line-down.png";
        const LINE_LEFT = "line-left.png";
        const LINE_RIGHT = "line-right.png";
        const LINE_HORIZONTAL = "line-horizontal.png";

        const params = new URLSearchParams(window.location.search);
        const imageId = params.get("id");

        const tree = document.getElementById("tree");
        const makeChildButton = document.getElementById("makeChildButton");

        if (!imageId) {
            tree.innerHTML = "<p class='empty'>No image selected.</p>";
            makeChildButton.style.display = "none";
        } else {
            makeChildButton.onclick = function () {
                window.location.href = `drawing.html?parent_id=${imageId}`;
            };

            loadTree();
        }

        async function getChildren(id) {
            const response = await fetch(`${API}/images/${id}`);
            const data = await response.json();
            return data.images;
        }

        function getConnectorImage(index, total) {
            const center = Math.floor(total / 2);

            if (total === 1) {
                return LINE_DOWN;
            }

            if (index === center) {
                return LINE_DOWN;
            }

            if (index < center) {
                return LINE_LEFT;
            }

            return LINE_RIGHT;
        }

        async function createNode(image) {
            const node = document.createElement("div");
            node.className = "node";

            const card = document.createElement("div");
            card.className = "nodeCard";

            card.onclick = function () {
                window.location.href = `childs.html?id=${image.id}`;
            };

            const img = document.createElement("img");

            img.src = image.url.startsWith("/get-image/")
                ? `${API}${image.url}`
                : `${API}/get-image/${image.id}`;

            card.appendChild(img);
            node.appendChild(card);

            const childImages = await getChildren(image.id);

            if (childImages.length > 0) {
                const connectorArea = document.createElement("div");
                connectorArea.className = "connectorArea";

                const vertical = document.createElement("img");
                vertical.className = "verticalConnector";
                vertical.src = LINE_DOWN;

                connectorArea.appendChild(vertical);

                const childrenDiv = document.createElement("div");
                childrenDiv.className = "children";

                for (let i = 0; i < childImages.length; i++) {
                    const child = childImages[i];

                    const childWrapper = document.createElement("div");
                    childWrapper.className = "childWrapper";

                    const connector = document.createElement("img");
                    connector.className = "sideConnector";
                    connector.src = getConnectorImage(i, childImages.length);

                    const childNode = await createNode(child);

                    childWrapper.appendChild(connector);
                    childWrapper.appendChild(childNode);

                    childrenDiv.appendChild(childWrapper);
                }

                if (childImages.length > 1) {
                    const horizontal = document.createElement("img");
                    horizontal.className = "horizontalConnector";
                    horizontal.src = LINE_HORIZONTAL;
                    connectorArea.appendChild(horizontal);
                }

                connectorArea.appendChild(childrenDiv);
                node.appendChild(connectorArea);
            }

            return node;
        }

        async function loadTree() {
            const rootImage = {
                id: imageId,
                url: `/get-image/${imageId}`
            };

            tree.innerHTML = "";

            const rootNode = await createNode(rootImage);
            tree.appendChild(rootNode);
        }
    </script>

</body>
</html>
