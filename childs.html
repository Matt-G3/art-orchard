<body>

    <h1>Selected Image</h1>
    <div id="selectedImage"></div>

    <button id="makeChildButton">Make branch image</button>

    <h2>Branches</h2>
    <div id="children" class="imageRow"></div>

    <script>
        const API = "https://Matthew2007.pythonanywhere.com";

        const params = new URLSearchParams(window.location.search);
        const imageId = params.get("id");

        const selectedImage = document.getElementById("selectedImage");
        const children = document.getElementById("children");
        const makeChildButton = document.getElementById("makeChildButton");

        if (!imageId) {
            selectedImage.innerHTML = "<p>No image selected.</p>";
            makeChildButton.style.display = "none";
        } else {
            const img = document.createElement("img");
            img.src = `${API}/get-image/${imageId}`;
            selectedImage.appendChild(img);

            makeChildButton.onclick = function () {
                window.location.href = `drawing.html?parent_id=${imageId}`;
            };

            fetch(`${API}/images/${imageId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.images.length === 0) {
                        children.innerHTML = "<p>No children yet.</p>";
                        return;
                    }

                    data.images.forEach(child => {
                        const link = document.createElement("a");
                        link.href = `branch-view.html?id=${child.id}`;

                        const childImg = document.createElement("img");
                        childImg.src = `${API}${child.url}`;

                        link.appendChild(childImg);
                        children.appendChild(link);
                    });
                });
        }
    </script>

</body>
