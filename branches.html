<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .imageRow {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 15px;
            border: 1px solid black;
        }

        .imageRow img {
            width: 220px;
            height: 160px;
            object-fit: contain;
            border: 1px solid black;
            cursor: pointer;
        }

        .imageRow img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Base Images</h1>

    <div id="baseImages" class="imageRow"></div>

    <script>
        const API = "https://Matthew2007.pythonanywhere.com";

        const baseImagesDiv = document.getElementById("baseImages");

        fetch(`${API}/base-images`)
            .then(response => response.json())
            .then(data => {
                data.base_images.forEach(image => {
                    const link = document.createElement("a");

                    link.href = `childs.html?id=${image.id}`;

                    const img = document.createElement("img");

                    img.src = `${API}${image.url}`;

                    link.appendChild(img);

                    baseImagesDiv.appendChild(link);
                });
            });
    </script>

</body>
</html>
