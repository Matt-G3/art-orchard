<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Art Orchard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding: 50px;

            font-family: Arial, sans-serif;
            

            background:
                radial-gradient(
                    circle at top left,
                    rgba(255,255,255,0.7),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #f7f4ed 0%,
                    #e7e0d3 100%
                );

            color: #222;
        }

        .topBar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 40px;
        }

        h1 {
            margin: 0;

            font-size: 58px;

            letter-spacing: -2px;

            color: #1d1d1d;
        }

        .subText {
            margin-top: 10px;

            font-size: 18px;

            opacity: 0.65;
        }

        .newButton {
            padding: 16px 24px;

            border-radius: 999px;

            border: none;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .newButton:hover {
            transform: translateY(-3px);

            background: black;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.18);
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));

            gap: 28px;
        }

        .card {
            position: relative;

            overflow: hidden;

            border-radius: 26px;

            background: rgba(255,255,255,0.68);

            backdrop-filter: blur(10px);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.14);
        }

        .card img {
            width: 100%;

            height: 240px;

            object-fit: contain;

            background: white;

            padding: 18px;

            display: block;
        }

        .cardInfo {
            padding: 18px;
        }

        .cardTitle {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .cardSub {
            opacity: 0.6;

            font-size: 14px;
        }

        a {
            text-decoration: none;

            color: inherit;
        }

        .loading {
            font-size: 20px;

            opacity: 0.6;
        }

    </style>
</head>

<body>

    <div class="topBar">

        <div>
            <h1>Art Orchard</h1>

            <div class="subText">
                Explore branching artwork from the community.
            </div>
        </div>

        <a href="drawing.html">
            <button class="newButton">
                + New Drawing
            </button>
        </a>

    </div>

    <div id="gallery" class="gallery">

        <div class="loading">
            Loading artwork...
        </div>

    </div>

    <script>

        const API =
            "https://Matthew2007.pythonanywhere.com";

        const gallery =
            document.getElementById("gallery");

        fetch(`${API}/base-images`)
            .then(response => response.json())
            .then(data => {

                gallery.innerHTML = "";

                data.base_images.forEach(image => {

                    const link =
                        document.createElement("a");

                    link.href =
                        `childs.html?id=${image.id}`;

                    link.className = "card";

                    const img =
                        document.createElement("img");

                    img.src =
                        `${API}${image.url}`;

                    const info =
                        document.createElement("div");

                    info.className = "cardInfo";

                    info.innerHTML = `
                        <div class="cardTitle">
                            Artwork
                        </div>

                        <div class="cardSub">
                            Open branch tree
                        </div>
                    `;

                    link.appendChild(img);

                    link.appendChild(info);

                    gallery.appendChild(link);
                });

                if (data.base_images.length === 0) {

                    gallery.innerHTML = `
                        <div class="loading">
                            No artwork yet.
                        </div>
                    `;
                }
            });

    </script>

</body>
</html>
