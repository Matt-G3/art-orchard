<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw - Art Orchard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #f7f4ed 0%, #ece7dc 100%);
            color: #222;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 42px;
            letter-spacing: -1px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            width: fit-content;
            border-radius: 18px;
            background: rgba(255,255,255,0.65);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        input[type="color"] {
            width: 46px;
            height: 46px;
            border: none;
            background: none;
            cursor: pointer;
        }

        input[type="range"] {
            width: 180px;
        }

        #saveButton {
            padding: 12px 20px;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 999px;
            background: #222;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #saveButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        }

        #canvas {
            display: block;
            width: 600px;
            height: 400px;
            border-radius: 22px;
            border: 1px solid rgba(0,0,0,0.12);
            background: white;
            touch-action: none;
            box-shadow: 0 16px 40px rgba(0,0,0,0.12);
        }
    </style>
</head>

<body>

    <h1>Draw Something</h1>

    <div class="toolbar">
        <input type="color" id="penColor" value="#000000">

        <input type="range" id="penSize" min="1" max="50" value="4">

        <button id="saveButton">Save</button>
    </div>

    <canvas id="canvas" width="600" height="400"></canvas>

    <script>
        const API = "https://Matthew2007.pythonanywhere.com";

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const penColor = document.getElementById("penColor");
        const penSize = document.getElementById("penSize");
        const saveButton = document.getElementById("saveButton");

        const params = new URLSearchParams(window.location.search);
        const parentId = params.get("parent_id");

        let drawing = false;

        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        canvas.addEventListener("pointerdown", function (event) {
            drawing = true;
            canvas.setPointerCapture(event.pointerId);

            ctx.beginPath();
            ctx.moveTo(event.offsetX, event.offsetY);
        });

        canvas.addEventListener("pointermove", function (event) {
            if (!drawing) return;

            ctx.strokeStyle = penColor.value;
            ctx.lineWidth = penSize.value;

            ctx.lineTo(event.offsetX, event.offsetY);
            ctx.stroke();
        });

        canvas.addEventListener("pointerup", function (event) {
            drawing = false;
            canvas.releasePointerCapture(event.pointerId);
        });

        canvas.addEventListener("pointerleave", function () {
            drawing = false;
        });

        canvas.addEventListener("pointercancel", function () {
            drawing = false;
        });

        saveButton.onclick = function () {
            canvas.toBlob(async function (blob) {
                const formData = new FormData();
                formData.append("image", blob, "drawing.png");

                const uploadUrl = parentId
                    ? `${API}/upload_image/${parentId}`
                    : `${API}/upload_image`;

                try {
                    const response = await fetch(uploadUrl, {
                        method: "POST",
                        body: formData
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        alert("Upload failed");
                        console.log(result);
                        return;
                    }

                    window.location.href = "choose.html";

                } catch (error) {
                    console.error("Upload error:", error);
                    alert("Upload error. Check console.");
                }
            }, "image/png");
        };
    </script>

</body>

</html>
